# Upstream board leaves the image at 0x0; link it into the code partition (0x26000)
# behind the SoftDevice area that the UF2 bootloader expects.
CONFIG_USE_DT_CODE_PARTITION=y

# The on-board QSPI flash is unused; its driver is only needed to put the chip into
# deep power-down at boot (suspend-devices in the overlay).
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_PM_DEVICE=y

# Single Li-ion cell on the battery connector, measured directly.
CONFIG_OPENPULT_BATT_LI_ION=y
CONFIG_OPENPULT_BATT_CELLS=1
CONFIG_OPENPULT_BATT_DIODE_MV=0
