# Production build: no console, no USB, no logs. debug.conf adds them.

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OpenPult"
# Generic Remote Control
CONFIG_BT_DEVICE_APPEARANCE=384
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CTLR_TX_PWR_0=y
# Static random identity address: iOS keys the accessory by it.
CONFIG_BT_PRIVACY=n

# Large writes in one ATT PDU (244 bytes); no prepared writes.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=0

# LE Secure Connections, Just Works, bonding (2 bonds, oldest overwritten)
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Re-pairing after "Forget This Device" reuses the iPhone's identity; without this
# Zephyr refuses Just Works over the old key. Who may pair at all is decided in
# pairing_accept (no bonds yet, or 120 s after power-on).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y

# Let iOS refresh its GATT cache after a firmware update changes the layout.
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y

# Connection parameters: 15-30 ms, latency 0, supervision timeout 4 s
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="openpult-ir"
# Firmware revision from VERSION, hardware revision = board target (see Kconfig)
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y

# Bonds live in the storage partition. Page erases in 3 ms slices: a full erase stalls
# the CPU for ~85 ms, longer than an IR refill deadline (one PWM half, >= 15 ms).
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# IR through nrfx PWM/GPIOTE/PPI directly, battery through the ADC
CONFIG_NRFX_PWM=y
CONFIG_ADC=y
CONFIG_REBOOT=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Idle current: nothing but the radio and the RTC may run.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
