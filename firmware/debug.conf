# Debug build: USB CDC ACM console with logs, led0 lit while IR is transmitted.
#   west build -b <board> -d build-debug firmware -- -DEXTRA_CONF_FILE=debug.conf
# (CMakeLists.txt adds debug.overlay, which re-enables the USB controller.)

CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_OPENPULT_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y

CONFIG_OPENPULT_DEBUG_LED=y
CONFIG_ASSERT=y
