name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p dist
          find artifacts -name '*.uf2' -o -name '*.hex' | xargs -I{} cp {} dist/
          (cd artifacts/enclosure-stl && zip -r ../../dist/openpult-enclosure-stl.zip .)
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
